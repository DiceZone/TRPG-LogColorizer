server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 染色器的日志密码在地址的 # 后面，不会发到服务器；这里也不记访问日志里的查询参数。
    log_format lc '$remote_addr [$time_local] "$request_method $uri" $status';
    access_log /var/log/nginx/access.log lc;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带哈希的构建产物长期缓存；配置与主题随时可能改，不缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }
    location /themes/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
